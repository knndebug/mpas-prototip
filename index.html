<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MPAS 2.0 — Məhkəmə Prosesləri Altsistemi (Prototip)</title>
<style>
:root{
  --blue:#1b4f8a; --blue-d:#123a68; --blue-l:#e8f0fa; --bg:#f4f6f9; --line:#dde3ea;
  --text:#1f2937; --mut:#6b7280; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --r:10px; font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid #9dbde4;border-color:var(--blue)}
input[type=range]{padding:0;border:none}
label{font-size:12px;font-weight:600;color:#374151;display:block;margin-bottom:3px}
label .rq{color:var(--red)}
.field{margin-bottom:10px}
.btn{border:none;border-radius:7px;padding:8px 14px;font-size:13px;font-weight:600}
.btn-p{background:var(--blue);color:#fff}.btn-p:hover{background:var(--blue-d)}
.btn-s{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn-g{background:#eef1f5;color:#374151}
.btn-r{background:#fee2e2;color:var(--red)}
.btn-sm{padding:4px 9px;font-size:12px}
#login{position:fixed;inset:0;background:linear-gradient(135deg,#123a68,#1b4f8a);display:flex;align-items:center;justify-content:center;z-index:100}
.login-card{background:#fff;border-radius:14px;padding:34px;width:420px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-card h1{font-size:20px;color:var(--blue-d);margin-bottom:4px}
.login-card .sub{color:var(--mut);font-size:12.5px;margin-bottom:20px}
.badge-eimza{display:inline-block;background:var(--blue-l);color:var(--blue);font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;margin-bottom:14px}
#app{display:none;min-height:100vh}
#side{position:fixed;top:0;left:0;bottom:0;width:240px;background:var(--blue-d);color:#dbe6f3;display:flex;flex-direction:column;z-index:10}
#side .logo{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
#side .logo b{color:#fff;font-size:16px}
#side .logo div{font-size:10.5px;opacity:.75;margin-top:3px;line-height:1.4}
#nav{flex:1;overflow:auto;padding:10px 8px}
.nav-h{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.55;padding:12px 10px 4px}
.nav-i{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:8px;font-size:13px;color:#cfdcec;margin-bottom:2px;cursor:pointer}
.nav-i:hover{background:rgba(255,255,255,.08)}
.nav-i.act{background:var(--blue);color:#fff;font-weight:600}
.nav-i .cnt{margin-left:auto;background:rgba(255,255,255,.15);border-radius:12px;font-size:11px;padding:1px 7px}
#side .usr{padding:12px 14px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
#side .usr b{color:#fff;display:block}
#side .usr .role{opacity:.7}
#main{margin-left:240px;padding:22px 26px 60px}
.pagehead{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.pagehead h2{font-size:19px;color:var(--blue-d)}
.pagehead .sp{flex:1}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:#f1f5f9;text-align:left;padding:8px 9px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#475569;border-bottom:1px solid var(--line)}
td{padding:8px 9px;border-bottom:1px solid #edf1f5;vertical-align:top}
tr.rowlink:hover{background:var(--blue-l);cursor:pointer}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.pl-blue{background:var(--blue-l);color:var(--blue)}
.pl-green{background:#dcfce7;color:var(--green)}
.pl-amber{background:#fef3c7;color:var(--amber)}
.pl-red{background:#fee2e2;color:var(--red)}
.pl-gray{background:#e5e7eb;color:#4b5563}
.uid{font-family:Consolas,monospace;font-size:12px;color:var(--blue-d);font-weight:700}
.mut{color:var(--mut);font-size:12px}
.empty{padding:36px;text-align:center;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .n{font-size:24px;font-weight:700;color:var(--blue-d)}
.stat .l{font-size:12px;color:var(--mut);margin-top:2px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tab{padding:8px 14px;font-size:13px;font-weight:600;color:var(--mut);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab.act{color:var(--blue);border-bottom-color:var(--blue)}
#ovl{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:40px 16px}
#ovl.open{display:flex}
.modal{background:#fff;border-radius:12px;width:720px;max-width:100%;padding:22px}
.modal h3{font-size:16px;color:var(--blue-d);margin-bottom:14px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.inst{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:14px;margin-bottom:12px;background:#fff}
.inst h4{font-size:14px;color:var(--blue-d);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:230px 1fr;gap:4px 10px;font-size:12.5px;margin-top:8px}
.kv .k{color:var(--mut)}
.subl{font-size:12px;font-weight:700;color:#475569;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.03em}
.chip{display:inline-block;background:#f1f5f9;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;margin:2px 3px 2px 0}
.chip.arch{opacity:.5;text-decoration:line-through}
.warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px}
.toast{position:fixed;bottom:20px;right:20px;background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:200;display:none}
.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.slwrap{display:flex;gap:10px;align-items:center}
.slwrap input[type=number]{width:110px}
@media(max-width:1100px){.filters{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="badge-eimza">MEİS · Elektron imza (imitasiya)</div>
    <h1>MPAS 2.0 <span id="loginVer" class="pill pl-gray" style="font-size:11px;vertical-align:middle"></span></h1>
    <div class="sub">Məhkəmə Prosesləri Altsistemi — ƏƏSMN · DOST Rəqəmsal İnnovasiyalar Mərkəzi<br><b>İşlək prototip</b> — inteqrasiyalar (MİS, İAMAS, DVX, MEİS) imitasiya rejimindədir.</div>

    <button class="btn btn-p" style="width:100%" onclick="doLogin()">E-imza ilə daxil ol</button>
  </div>
</div>

<div id="app">
  <div id="side">
    <div class="logo"><b>MPAS 2.0</b> <a href="#" id="verLink" onclick="mChangelog();return false" style="color:#9fc0e4;font-size:11px;text-decoration:none;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:1px 7px" title="Dəyişikliklər jurnalı"></a><div>Məhkəmə Prosesləri Altsistemi<br>ƏƏSMN — prototip</div></div>
    <div id="nav"></div>
    <div class="usr"><b id="usrName"></b><span class="role" id="usrRole"></span><br>
      <button class="btn btn-sm btn-g" style="margin-top:8px" onclick="logout()">Çıxış</button>
    </div>
  </div>
  <div id="main"></div>
</div>

<div id="ovl" onclick="if(event.target===this)closeModal()"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

function refOpts(o,store){const k=typeof o==='function'?o(store):o;return DB.refs[k]||[]}
function dynRender(fields,store,pfx){
  return fields.map(f=>{
    if(f.show&&!f.show(store)) return '';
    const req=f.req&&f.req(store);
    const lab=`<label>${esc(f.l)}${req?' <span class="rq">*</span>':''}</label>`;
    const v=store[f.k]??'';
    const oc=`dset('${pfx}','${f.k}',this.value${f.trig?',1':''})`;
    if(f.t==='text') return `<div class="field">${lab}<input value="${esc(v)}" onchange="${oc}"></div>`;
    if(f.t==='area') return `<div class="field" style="grid-column:1/-1">${lab}<textarea rows="2" onchange="${oc}">${esc(v)}</textarea></div>`;
    if(f.t==='date') return `<div class="field">${lab}<input type="date" value="${esc(v)}" onchange="${oc}"></div>`;
    if(f.t==='select'){
      const opts=refOpts(f.o,store);
      return `<div class="field">${lab}<select onchange="${oc}"><option value="">— seçin —</option>${opts.map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
    }
    if(f.t==='slider'){
      const n=+v||0;
      return `<div class="field" style="grid-column:1/-1">${lab}<div class="slwrap">
        <input type="range" min="0" max="50000" step="1" value="${n}" oninput="this.parentElement.querySelector('input[type=number]').value=this.value" onchange="dset('${pfx}','${f.k}',+this.value)">
        <input type="number" min="0" max="50000" value="${n}" oninput="this.parentElement.querySelector('input[type=range]').value=this.value" onchange="dset('${pfx}','${f.k}',+this.value)"> AZN</div></div>`;
    }
    if(f.t==='multi'){
      const arr=Array.isArray(v)?v:[];
      const opts=refOpts(f.o,store).filter(o=>!arr.includes(o));
      return `<div class="field" style="grid-column:1/-1">${lab}
        <div>${arr.map((a,i)=>`<span class="chip">${esc(a)} <a href="#" style="color:var(--red)" onclick="dmdel('${pfx}','${f.k}',${i});return false">✕</a></span>`).join('')||'<span class="mut">Seçilməyib</span>'}</div>
        <div style="display:flex;gap:8px;margin-top:6px;max-width:420px">
          <select id="dm_${pfx}_${f.k}">${opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>
          <button class="btn btn-s btn-sm" type="button" onclick="dmadd('${pfx}','${f.k}')">Əlavə et</button></div></div>`;
    }
    return '';
  }).join('');
}
function dset(pfx,k,v,rerender){TMP[pfx]=TMP[pfx]||{};TMP[pfx][k]=v;if(rerender&&REDRAW)REDRAW()}
function dmadd(pfx,k){const s=$('dm_'+pfx+'_'+k);if(!s||!s.value)return;const st=TMP[pfx];st[k]=Array.isArray(st[k])?st[k]:[];if(!st[k].includes(s.value))st[k].push(s.value);REDRAW&&REDRAW()}
function dmdel(pfx,k,i){TMP[pfx][k].splice(i,1);REDRAW&&REDRAW()}
function dynKV(fields,store){
  return fields.filter(f=>{const v=store[f.k];return v!==undefined&&v!==''&&!(Array.isArray(v)&&!v.length)&&(!f.show||f.show(store))})
    .map(f=>{let v=store[f.k];if(Array.isArray(v))v=v.join(', ');else if(f.t==='date')v=fmtD(v);else if(f.t==='slider')v=v+' AZN';
      return `<div class="k">${esc(f.l)}</div><div>${esc(v)}</div>`}).join('');
}
function reqMissing(fields,store){
  return fields.filter(f=>(!f.show||f.show(store))&&f.req&&f.req(store)&&!store[f.k]).map(f=>f.l);
}

/* ================= NAVİQASİYA ================= */
function render(){
  let nav = `<div class="nav-h">Məhkəmə işləri</div>`;
  nav += CASE_TYPES.map(t=>{
    const n=DB.cases.filter(c=>c.type===t.id).length;
    return `<div class="nav-i ${VIEW.page==='list'&&VIEW.type===t.id?'act':''}" onclick="go('list','${t.id}')">${t.name}<span class="cnt">${n}</span></div>`;
  }).join('');
  nav += `<div class="nav-h">Analitika</div>
    <div class="nav-i ${VIEW.page==='reports'?'act':''}" onclick="go('reports')">Hesabatlar</div>`;
  if(can('admin')) nav += `<div class="nav-h">İdarəetmə</div>
    <div class="nav-i ${VIEW.page==='admin'?'act':''}" onclick="go('admin')">Admin Panel</div>`;
  $('nav').innerHTML=nav;
  const m=$('main');
  if(VIEW.page==='list') m.innerHTML=viewList(VIEW.type);
  else if(VIEW.page==='detail') m.innerHTML=viewDetail();
  else if(VIEW.page==='reports') m.innerHTML=viewReports();
  else if(VIEW.page==='admin') m.innerHTML=viewAdmin();
}
function go(page,type){VIEW={page,type:type||VIEW.type};DETAIL=null;render()}
function openCase(uid,tab){DETAIL={uid,tab:tab||0};VIEW.page='detail';render()}
const cur=c=>c.instances[c.instances.length-1]||{};

/* ================= SİYAHI ================= */
let FLT={};
function viewList(type){
  const t=CASE_TYPES.find(x=>x.id===type);
  let rows=DB.cases.filter(c=>c.type===type);
  const f=FLT;
  if(f.q) rows=rows.filter(c=>c.uid.toLowerCase().includes(f.q.toLowerCase())||c.instances.some(i=>(i.caseNo||'').toLowerCase().includes(f.q.toLowerCase())));
  if(f.court) rows=rows.filter(c=>c.instances.some(i=>i.courtId==f.court));
  if(f.judge) rows=rows.filter(c=>c.instances.some(i=>i.judgeId==f.judge));
  if(f.status) rows=rows.filter(c=>c.status===f.status);
  if(f.org) rows=rows.filter(c=>c.general.orgId==f.org);
  if(f.inst) rows=rows.filter(c=>String(cur(c).level)===f.inst);
  if(f.party) rows=rows.filter(c=>c.instances.some(i=>i.parties.some(p=>p.name.toLowerCase().includes(f.party.toLowerCase()))));
  const trs=rows.map(c=>{
    const i=cur(c);
    return `<tr class="rowlink" onclick="openCase('${c.uid}')">
      <td><span class="uid">${c.uid}</span></td>
      <td>${esc(i.caseNo||'—')}<div class="mut">${INST_LEVELS[i.level]||'—'}</div></td>
      <td>${esc(courtN(i.courtId))}<div class="mut">${esc(judgeN(i.judgeId))}</div></td>
      <td>${esc(orgN(c.general.orgId))}</td>
      <td>${esc(i.predmet||'—')}</td>
      <td>${fmtD(i.inDate)}</td>
      <td>${statusPill(c.status)}${c.general.extra&&c.general.extra.netice?`<div class="mut">${esc(c.general.extra.netice)}</div>`:''}</td></tr>`;
  }).join('');
  return `<div class="pagehead"><h2>${t.name}</h2><span class="pill pl-blue">${rows.length} iş</span><div class="sp"></div>
      ${can('write')?`<button class="btn btn-p" onclick="mNewCase('${type}')">+ Yeni iş</button>`:''}
      <button class="btn btn-s" onclick="exportCSV('${type}')">Excel (CSV) ixrac</button></div>
    <div class="card">
      <div class="filters">
        <input placeholder="UID / iş nömrəsi axtar" value="${esc(f.q||'')}" onchange="FLT.q=this.value;render()">
        <select onchange="FLT.court=this.value;render()"><option value="">Məhkəmə (hamısı)</option>${DB.courts.map(c=>`<option value="${c.id}" ${f.court==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select>
        <select onchange="FLT.judge=this.value;render()"><option value="">Hakim (hamısı)</option>${DB.judges.map(j=>`<option value="${j.id}" ${f.judge==j.id?'selected':''}>${esc(j.name)}</option>`).join('')}</select>
        <select onchange="FLT.status=this.value;render()"><option value="">Status (hamısı)</option>${DB.refs.workStatus.map(s=>`<option ${f.status===s?'selected':''}>${s}</option>`).join('')}</select>
        <select onchange="FLT.org=this.value;render()"><option value="">Qurum (hamısı)</option>${DB.orgs.map(o=>`<option value="${o.id}" ${f.org==o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select>
        <select onchange="FLT.inst=this.value;render()"><option value="">Cari instansiya (hamısı)</option>${Object.entries(INST_LEVELS).map(([k,v])=>`<option value="${k}" ${f.inst===k?'selected':''}>${v}</option>`).join('')}</select>
        <input placeholder="Tərəf üzrə axtar" value="${esc(f.party||'')}" onchange="FLT.party=this.value;render()">
        <button class="btn btn-g" onclick="FLT={};render()">Filtri sıfırla</button>
      </div>
      ${rows.length?`<div style="overflow:auto"><table><tr><th>UID</th><th>İş nömrəsi</th><th>Məhkəmə / Hakim</th><th>Qurum</th><th>Predmet</th><th>Daxil olma</th><th>Status / Nəticə</th></tr>${trs}</table></div>`:`<div class="empty">Bu meyarlara uyğun iş tapılmadı</div>`}
    </div>`;
}

  const tabs=['Ümumi məlumat','İnstansiyalar','İcra vəziyyəti','Tarixçə'];

function rmParty(uid,ix,pi){const c=DB.cases.find(x=>x.uid===uid);const p=c.instances[ix].parties.splice(pi,1)[0];chist(c,`Tərəf silindi: ${p.name}`);render()}

function openModal(html){$('modalBox').innerHTML=html;$('ovl').classList.add('open')}
function closeModal(){$('ovl').classList.remove('open');REDRAW=null}

function mNewCase(type){
  TMP={G:{}};
  REDRAW=()=>drawGeneral(type,null);
  drawGeneral(type,null);
}
function mEditGeneral(uid){
  const c=DB.cases.find(x=>x.uid===uid),g=c.general;

}
function drawGeneral(type,uid){
  const s=TMP.G;
  openModal(`<h3>${uid?'Ümumi məlumat — '+uid:'Yeni iş — '+typeN(type)}</h3>
    ${uid?'':'<div class="warn">İş yaradıldıqda sistem avtomatik unikal <b>UID</b> təyin edir. İş növü sonradan dəyişdirilə bilməz.</div>'}
    <div class="grid g2">
      <div class="field"><label>Qurum (tərəf olan)</label><select onchange="dset('G','_orgId',+this.value)">${DB.orgs.map(o=>`<option value="${o.id}" ${s._orgId==o.id?'selected':''}>${esc(o.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Struktur bölmə</label><select onchange="dset('G','_structId',+this.value)">${DB.structs.map(x=>`<option value="${x.id}" ${s._structId==x.id?'selected':''}>${esc(orgN(x.orgId))} — ${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Nümayəndə</label><input value="${esc(s._rep??(USER?USER.name:''))}" onchange="dset('G','_rep',this.value)"></div>
      <div class="field"><label>Məhkəmə işinin başlama tarixi</label><input type="date" value="${esc(s._fact||'')}" onchange="dset('G','_fact',this.value)"></div>
      <div class="field"><label>Məhkəmə işinin yekunlaşdığı tarix</label><input type="date" value="${esc(s._org||'')}" onchange="dset('G','_org',this.value)"></div>
      <div class="field"><label>Əlavə qeyd</label><input value="${esc(s._note||'')}" onchange="dset('G','_note',this.value)"></div>
      ${dynRender(SCHEMAS[type].general,s,'G')}
    </div>
    <div class="foot"><button class="btn btn-g" onclick="closeModal()">İmtina</button>
    <button class="btn btn-p" onclick="saveGeneral('${type}','${uid||''}')">${uid?'Yadda saxla':'Yarat'}</button></div>`);
}
function saveGeneral(type,uid){
  const s=TMP.G;
  const extra={}; Object.keys(s).forEach(k=>{if(!k.startsWith('_'))extra[k]=s[k]});
  if(!uid){
    DB.seq++; uid=`MPAS-2026-${String(DB.seq).padStart(6,'0')}`;
    const c={uid,type,status:extra.status||'Davam edir',
      general:{orgId:s._orgId||DB.orgs[0].id,structId:s._structId||DB.structs[0].id,repName:s._rep??(USER?USER.name:''),factStart:s._fact||'',orgStart:s._org||'',note:s._note||'',extra},
      icra:{status:'İcraya yönəldilməyib',note:''},instances:[],history:[]};
    DB.cases.push(c); chist(c,'İş yaradıldı'); audit('Yeni iş yaradıldı',uid);
    closeModal(); toast(`İş yaradıldı: ${uid}`); openCase(uid,1); mInstance(uid,-1);
  } else {
    const c=DB.cases.find(x=>x.uid===uid);
    Object.assign(c.general,{orgId:s._orgId,structId:s._structId,repName:s._rep,factStart:s._fact,orgStart:s._org,note:s._note,extra});
    if(extra.status)c.status=extra.status;
    chist(c,'Ümumi məlumat redaktə edildi'); audit('Ümumi məlumat redaktə edildi',uid);
    closeModal(); render();
  }
}

function mInstance(uid,ix){
  const c=DB.cases.find(x=>x.uid===uid);
  const i = ix>=0 ? c.instances[ix] : null;
  TMP={I:Object.assign(
    {_level:i?i.level:1,_court:i?i.courtId:'',_judge:i?i.judgeId:'',_caseNo:i?i.caseNo:'',_inDate:i?i.inDate:'',_predmet:i?i.predmet:'',_status:i?i.status:'Baxılır',
     _dtype:i&&i.decision?i.decision.type:'',_ddate:i&&i.decision?i.decision.date:'',_dnote:i&&i.decision?i.decision.note:''},
    i?i.extra:{})};
  REDRAW=()=>drawInstance(uid,ix);
  drawInstance(uid,ix);
}
function drawInstance(uid,ix){
  const c=DB.cases.find(x=>x.uid===uid);
  const t=CASE_TYPES.find(x=>x.id===c.type);
  const s=TMP.I;
  const levels=Object.entries(INST_LEVELS).filter(([k])=>+k<=t.maxInst);
  const courts=DB.courts.filter(x=>x.level===+s._level);
  if(!courts.find(x=>x.id==s._court)) s._court=courts.length?courts[0].id:'';
  const judges=DB.judges.filter(j=>j.courtId==s._court&&j.active);
  if(!judges.find(j=>j.id==s._judge)) s._judge=judges.length?judges[0].id:'';
  const ifields=(SCHEMAS[c.type].inst&&SCHEMAS[c.type].inst[+s._level])||[];
  openModal(`<h3>${ix>=0?'İnstansiya redaktəsi':'Yeni instansiya mərhələsi'} — ${uid}</h3>
    ${t.id==='xeta'?`<div class="warn">İnzibati xəta işləri yalnız I instansiya və apellyasiya üzrə hərəkət edə bilər.</div>`:''}
    <div class="grid g2">
      <div class="field"><label>İnstansiya səviyyəsi</label><select onchange="dset('I','_level',+this.value,1)">${levels.map(([k,v])=>`<option value="${k}" ${s._level==k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label>Məhkəmənin adı</label><select onchange="dset('I','_court',+this.value,1)">${courts.map(x=>`<option value="${x.id}" ${s._court==x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Hakim</label><select onchange="dset('I','_judge',+this.value)">${judges.map(j=>`<option value="${j.id}" ${s._judge==j.id?'selected':''}>${esc(j.name)} (${esc(j.spec)})</option>`).join('')||'<option value="">—</option>'}</select></div>
      <div class="field"><label>İşin nömrəsi (instansiya üzrə)</label><input value="${esc(s._caseNo)}" onchange="dset('I','_caseNo',this.value)"></div>
      <div class="field"><label>Daxil olma tarixi</label><input type="date" value="${esc(s._inDate)}" onchange="dset('I','_inDate',this.value)"></div>
      <div class="field"><label>İşin predmeti</label><select onchange="dset('I','_predmet',this.value)"><option value="">— seçin —</option>${DB.refs.predmets.map(p=>`<option ${s._predmet===p?'selected':''}>${p}</option>`).join('')}</select></div>
      <div class="field"><label>İnstansiya üzrə status</label><select onchange="dset('I','_status',this.value)">${DB.refs.instStatus.map(x=>`<option ${s._status===x?'selected':''}>${x}</option>`).join('')}</select></div>
    </div>
    <div class="subl">İnstansiya üzrə əlavə məlumatlar</div>
    <div class="grid g2">${dynRender(ifields,s,'I')||'<span class="mut">Bu instansiya üçün əlavə xana yoxdur</span>'}</div>
    <div class="subl">Qərar (instansiya yekunlaşıbsa)</div>
    <div class="grid g3">
      <div class="field"><label>Qərar növü</label><select onchange="dset('I','_dtype',this.value)"><option value="">— yoxdur —</option>${DB.refs.decisionTypes.map(d=>`<option ${s._dtype===d?'selected':''}>${d}</option>`).join('')}</select></div>
      <div class="field"><label>Qərar tarixi</label><input type="date" value="${esc(s._ddate)}" onchange="dset('I','_ddate',this.value)"></div>
      <div class="field"><label>Qeyd</label><input value="${esc(s._dnote)}" onchange="dset('I','_dnote',this.value)"></div>
    </div>
    <div class="foot"><button class="btn btn-g" onclick="closeModal()">İmtina</button>
    <button class="btn btn-p" onclick="saveInstance('${uid}',${ix})">Yadda saxla</button></div>`);
}
function saveInstance(uid,ix){
  const c=DB.cases.find(x=>x.uid===uid);
  const t=CASE_TYPES.find(x=>x.id===c.type);
  const s=TMP.I;
  if(+s._level>t.maxInst){toast('Bu iş növü üçün həmin instansiya mümkün deyil');return}
  const ifields=(SCHEMAS[c.type].inst&&SCHEMAS[c.type].inst[+s._level])||[];
  const miss=reqMissing(ifields,s);
  if(miss.length){toast('Zəruri xanalar doldurulmayıb: '+miss.join(', '));return}
  const extra={}; Object.keys(s).forEach(k=>{if(!k.startsWith('_'))extra[k]=s[k]});
  const data={level:+s._level,courtId:+s._court||null,judgeId:+s._judge||null,caseNo:s._caseNo||'',inDate:s._inDate||'',predmet:s._predmet||'',status:s._status||'Baxılır',
    decision:s._dtype?{type:s._dtype,date:s._ddate||'',note:s._dnote||''}:null,extra};
  if(ix>=0){Object.assign(c.instances[ix],data);chist(c,`${INST_LEVELS[data.level]} məlumatları redaktə edildi`)}
  else{c.instances.push(Object.assign({parties:[],hearings:[]},data));chist(c,`Yeni mərhələ əlavə edildi: ${INST_LEVELS[data.level]}`)}
  audit('İnstansiya məlumatı yeniləndi',uid);
  closeModal(); DETAIL={uid,tab:1}; VIEW.page='detail'; render();
}

function p_hint(){
  const k=$('p_kind').value;
  $('p_codewrap').style.display=k==='Q'?'none':'block';
  $('p_codelabel').textContent=k==='F'?'FİN':'VÖEN';
  $('p_hintline').textContent=k==='F'?'İmitasiya FİN-ləri: 5AZE12R, 7BXK93T, 3QWE45Y':'İmitasiya VÖEN-ləri: 1234567890, 9876543210, 5555555555';
}
function p_lookup(){
  const k=$('p_kind').value, code=$('p_code').value.trim().toUpperCase();
  const rec = k==='F' ? IAMAS[code] : DVX[code];
  if(rec){$('p_name').value=rec.name;if(rec.addr)$('p_addr').value=rec.addr;toast((k==='F'?'İAMAS':'DVX')+' sorğusu uğurlu (imitasiya)')}
  else toast('Qeyd tapılmadı — imitasiya bazasındakı nümunə kodlardan istifadə edin');
}
function saveParty(uid,ix){
  const c=DB.cases.find(x=>x.uid===uid);
  const name=$('p_name').value.trim(); if(!name){toast('Ad boş ola bilməz');return}
  c.instances[ix].parties.push({kind:$('p_kind').value,code:$('p_kind').value==='Q'?'':$('p_code').value.trim(),name,role:$('p_role').value,addr:$('p_addr').value.trim(),arch:false});
  chist(c,`Tərəf əlavə edildi: ${name}`); closeModal(); render();
}

/* ================= HESABATLAR ================= */
function viewReports(){
  const total=DB.cases.length;
  const done=DB.cases.filter(c=>c.status==='Yekunlaşmış').length;
  const act=total-done;
  const byType=CASE_TYPES.map(t=>({t,n:DB.cases.filter(c=>c.type===t.id).length}));
  const byOrg=DB.orgs.map(o=>({o,n:DB.cases.filter(c=>c.general.orgId===o.id).length})).filter(x=>x.n);
  const byNetice={}; DB.cases.forEach(c=>{const n=c.general.extra&&c.general.extra.netice;if(n)byNetice[n]=(byNetice[n]||0)+1});
  const byCourt=DB.courts.map(co=>({co,n:DB.cases.filter(c=>c.instances.some(i=>i.courtId===co.id)).length})).filter(x=>x.n);
  const decs={}; DB.cases.forEach(c=>c.instances.forEach(i=>{if(i.decision)decs[i.decision.type]=(decs[i.decision.type]||0)+1}));
  const cerimeCem=DB.cases.reduce((a,c)=>a+(+(c.general.extra&&c.general.extra.cerime)||0),0);
  const bar=(n,max)=>`<div style="background:#e5edf7;border-radius:4px;height:14px"><div style="width:${max?Math.round(n/max*100):0}%;background:var(--blue);height:14px;border-radius:4px"></div></div>`;
  const mx=Math.max(...byType.map(x=>x.n),1);
  return `<div class="pagehead"><h2>Hesabatlar və statistik təhlillər</h2><div class="sp"></div>
      <button class="btn btn-p" onclick="exportCSV()">Tam reyestr — Excel (CSV)</button></div>
    <div class="stats">
      <div class="stat"><div class="n">${total}</div><div class="l">Ümumi işlər</div></div>
      <div class="stat"><div class="n">${act}</div><div class="l">Davam edən</div></div>
      <div class="stat"><div class="n">${done}</div><div class="l">Yekunlaşmış</div></div>
      <div class="stat"><div class="n">${cerimeCem.toLocaleString()} AZN</div><div class="l">Cərimələrin cəmi (İX işləri)</div></div>
    </div>
    <div class="grid g2">
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">İş növləri üzrə</h3>
        <table>${byType.map(x=>`<tr><td style="width:40%">${x.t.name}</td><td>${bar(x.n,mx)}</td><td style="width:40px;text-align:right"><b>${x.n}</b></td></tr>`).join('')}</table></div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">Nəticələr üzrə</h3>
        <table>${Object.entries(byNetice).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right"><b>${v}</b></td></tr>`).join('')||'<tr><td class="mut">Məlumat yoxdur</td></tr>'}</table></div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">Qurumlar üzrə</h3>
        <table>${byOrg.map(x=>`<tr><td>${esc(x.o.name)}</td><td style="text-align:right"><b>${x.n}</b></td></tr>`).join('')}</table></div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">Məhkəmələr üzrə</h3>
        <table>${byCourt.map(x=>`<tr><td>${esc(x.co.name)}</td><td style="text-align:right"><b>${x.n}</b></td></tr>`).join('')}</table></div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">Qərar növləri üzrə</h3>
        <table>${Object.entries(decs).map(([k,v])=>`<tr><td>${esc(k)}</td><td style="text-align:right"><b>${v}</b></td></tr>`).join('')||'<tr><td class="mut">Qərar qeyd edilməyib</td></tr>'}</table></div>
      <div class="card"><h3 style="font-size:14px;margin-bottom:10px;color:var(--blue-d)">Dövr üzrə seçmə ixrac</h3>
        <div class="grid g2"><div class="field"><label>Başlanğıc</label><input type="date" id="r_from"></div>
        <div class="field"><label>Son</label><input type="date" id="r_to"></div></div>
        <button class="btn btn-s" onclick="exportCSV(null,r_from.value,r_to.value)">Dövr üzrə CSV ixrac</button>
        <div class="mut" style="margin-top:6px">"Təhlil" AS üçün nəzərdə tutulan ixrac formatının imitasiyası.</div></div>
    </div>`;
}
function exportCSV(type,from,to){
  let rows=DB.cases.filter(c=>!type||c.type===type);
  if(from) rows=rows.filter(c=>c.instances.some(i=>i.inDate>=from));
  if(to) rows=rows.filter(c=>c.instances.some(i=>i.inDate<=to));
  const head=['UID','İş növü','Status','Nəticə','ESDAS','Qurum','Struktur bölmə','Nümayəndə','Başlama tarixi','Yekunlaşma tarixi','İnstansiya','Məhkəmə','Hakim','İşin nömrəsi','Daxil olma','Predmet','Tərəflər','Qərar','Qərar tarixi','Quruma təsiri','İcra statusu'];
  const lines=[head.join(';')];
  rows.forEach(c=>{const gx=c.general.extra||{};c.instances.forEach(i=>{const ex=i.extra||{};
    lines.push([c.uid,typeN(c.type),c.status,gx.netice||'',gx.esdas||'',orgN(c.general.orgId),structN(c.general.structId),c.general.repName,c.general.factStart,c.general.orgStart,
      INST_LEVELS[i.level],courtN(i.courtId),judgeN(i.judgeId),i.caseNo,i.inDate,i.predmet,
      i.parties.map(p=>`${p.name} (${p.role})`).join(', '),
      i.decision?i.decision.type:(ex.netice||ex.sikayetNetice||''),i.decision?i.decision.date:(ex.yekunTarix||''),ex.tesir||'',c.icra.status
    ].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(';'));
  })});
  const blob=new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`MPAS_reyestr_${type||'tam'}.csv`;a.click();
  audit('Reyestr CSV ixrac edildi',type?typeN(type):'tam');
  toast('CSV ixrac edildi — Excel-də açıla bilər');
}

let ATAB=0;
function viewAdmin(){
  const tabs=['Təşkilatlar','Struktur–Bölmə','Əməkdaşlar','Vəzifələr','Məhkəmələr','Hakimlər','Soraqçalar','Audit'];
  let body='';
  const misNote=`<div class="warn">Bu məlumatlar <b>MİS inteqrasiyası</b> əsasında avtomatik formalaşır (imitasiya). Əl ilə yaradılma/redaktə nəzərdə tutulmur.</div>`;
  if(ATAB===0) body=misNote+`<div class="card"><table><tr><th>Kod</th><th>Təşkilat</th><th>İşlərin sayı</th></tr>
    ${DB.orgs.map(o=>`<tr><td>${o.code}</td><td>${esc(o.name)}</td><td>${DB.cases.filter(c=>c.general.orgId===o.id).length}</td></tr>`).join('')}</table></div>`;
  else if(ATAB===1) body=misNote+`<div class="card"><table><tr><th>Təşkilat</th><th>Struktur bölmə</th></tr>
    ${DB.structs.map(s=>`<tr><td>${esc(orgN(s.orgId))}</td><td>${esc(s.name)}</td></tr>`).join('')}</table></div>`;
  else if(ATAB===2) body=misNote+`<div class="card"><table><tr><th>Ad</th><th>Təşkilat / Bölmə</th><th>Vəzifə</th><th>Rol (MEİS)</th><th>Status</th></tr>
    ${DB.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(orgN(e.orgId))}<div class="mut">${esc(structN(e.structId))}</div></td><td>${esc((DB.positions.find(p=>p.id===e.posId)||{}).name)}</td><td>${e.role}</td><td>${e.active?'<span class="pill pl-green">Aktiv</span>':'<span class="pill pl-gray">Deaktiv</span>'}</td></tr>`).join('')}</table></div>`;
  else if(ATAB===3) body=misNote+`<div class="card"><table><tr><th>Vəzifə</th></tr>${DB.positions.map(p=>`<tr><td>${esc(p.name)}</td></tr>`).join('')}</table></div>`;
  else if(ATAB===4) body=`<div class="card"><div style="text-align:right;margin-bottom:8px"><button class="btn btn-p btn-sm" onclick="mCourt()">+ Məhkəmə</button></div>
    <table><tr><th>Məhkəmə</th><th>İnstansiya</th><th>Növ</th></tr>
    ${DB.courts.map(c=>`<tr><td>${esc(c.name)}</td><td>${INST_LEVELS[c.level]}</td><td>${esc(c.type)}</td></tr>`).join('')}</table></div>`;
  else if(ATAB===5) body=`<div class="card"><div style="text-align:right;margin-bottom:8px"><button class="btn btn-p btn-sm" onclick="mJudge()">+ Hakim</button></div>
    <table><tr><th>Hakim</th><th>Məhkəmə</th><th>İxtisas</th><th>Status</th><th></th></tr>
    ${DB.judges.map(j=>`<tr><td>${esc(j.name)}</td><td>${esc(courtN(j.courtId))}</td><td>${esc(j.spec)}</td><td>${j.active?'<span class="pill pl-green">Aktiv</span>':'<span class="pill pl-gray">Deaktiv</span>'}</td>
      <td><button class="btn btn-g btn-sm" onclick="j_toggle(${j.id})">${j.active?'Deaktiv et':'Aktiv et'}</button></td></tr>`).join('')}</table></div>`;
  else if(ATAB===6){
    body=Object.keys(DB.refs).map(key=>`
      <div class="card"><h3 style="font-size:14px;color:var(--blue-d);margin-bottom:8px">${esc(REF_LABELS[key]||key)}</h3>
      ${DB.refs[key].map((v,i)=>`<span class="chip">${esc(v)} <a href="#" style="color:var(--red)" onclick="refDel('${key}',${i});return false">✕</a></span>`).join('')}
      <div style="display:flex;gap:8px;margin-top:8px;max-width:420px"><input id="ref_${key}" placeholder="Yeni dəyər"><button class="btn btn-s btn-sm" onclick="refAdd('${key}')">Əlavə et</button></div></div>`).join('');
  }
  else body=`<div class="card"><table><tr><th>Tarix</th><th>İstifadəçi</th><th>Əməliyyat</th><th>Detal</th></tr>
    ${DB.audit.map(a=>`<tr><td>${a.t}</td><td>${esc(a.u)}</td><td>${esc(a.a)}</td><td class="mut">${esc(a.d)}</td></tr>`).join('')||'<tr><td class="mut">Boşdur</td></tr>'}</table></div>`;
  return `<div class="pagehead"><h2>Admin Panel</h2><div class="sp"></div>
      <button class="btn btn-s" onclick="exportJSON()">Məlumatları JSON saxla</button>
      <label class="btn btn-g" style="display:inline-block">JSON yüklə<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"></label></div>
    <div class="tabs">${tabs.map((t,i)=>`<button class="tab ${ATAB===i?'act':''}" onclick="ATAB=${i};render()">${t}</button>`).join('')}</div>${body}`;
}
function mCourt(){
  openModal(`<h3>Yeni məhkəmə</h3>
    <div class="field"><label>Ad</label><input id="c_name"></div>
    <div class="grid g2"><div class="field"><label>İnstansiya</label><select id="c_level">${Object.entries(INST_LEVELS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
    <div class="field"><label>Növ</label><input id="c_type" value="Ümumi"></div></div>

}
function mJudge(){
  openModal(`<h3>Yeni hakim</h3>
    <div class="field"><label>Ad</label><input id="j_name"></div>
    <div class="grid g2"><div class="field"><label>Məhkəmə</label><select id="j_court">${DB.courts.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
    <div class="field"><label>İxtisas</label><input id="j_spec" value="Mülki"></div></div>
    <div class="foot"><button class="btn btn-g" onclick="closeModal()">İmtina</button>
    <button class="btn btn-p" onclick="(function(){if(!j_name.value.trim())return;DB.judges.push({id:Math.max(...DB.judges.map(j=>j.id))+1,name:j_name.value,courtId:+j_court.value,spec:j_spec.value,active:true});audit('Hakim əlavə edildi',j_name.value);closeModal();render()})()">Əlavə et</button></div>`);
}
function j_toggle(id){const j=DB.judges.find(x=>x.id===id);j.active=!j.active;audit('Hakim statusu dəyişdirildi',j.name);render()}
function refAdd(key){const v=$('ref_'+key).value.trim();if(!v)return;DB.refs[key].push(v);audit('Soraqçaya dəyər əlavə edildi',key+': '+v);render()}
function refDel(key,i){const v=DB.refs[key][i];DB.refs[key].splice(i,1);audit('Soraqçadan dəyər silindi',key+': '+v);render()}
function exportJSON(){
  const blob=new Blob([JSON.stringify({seq:DB.seq,cases:DB.cases,courts:DB.courts,judges:DB.judges,refs:DB.refs,audit:DB.audit},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mpas_data.json';a.click();
  toast('Məlumatlar JSON faylına saxlanıldı');
}
function importJSON(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);Object.assign(DB,{seq:d.seq,cases:d.cases,courts:d.courts,judges:d.judges,refs:d.refs,audit:d.audit||[]});toast('Məlumatlar yükləndi');render()}catch(e){toast('Fayl oxuna bilmədi')}};
  r.readAsText(f);
}
